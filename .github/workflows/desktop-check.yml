# Builds the desktop packages and starts each one on Windows and macOS.
# Run it by hand from the Actions tab. With "publish" ticked, GitHub signs a build provenance for each package.
# Both systems must pass. Then the packages go to the "desktop" release.
# Anyone can check a download: gh attestation verify <file>.zip --repo leon1111-wgl/rain-or-shine
name: Desktop check

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Sign the packages and put them on the desktop release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every installed package must carry a valid npm registry signature.
      - run: npm audit signatures
      # Shared runners hit the public RPCs' rate limits. This job skips the read-only Sepolia check.
      # A local build runs it: npm run package:desktop.
      - run: npx tsx scripts/package-desktop.ts
      - if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/*/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop
          path: release/*/*.zip

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop
          path: zips
      - name: Unzip and start the Windows package
        shell: pwsh
        run: |
          $zip = Get-ChildItem zips -Recurse -Filter Rain-or-Shine-Windows-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "test folder"
          $start = Get-ChildItem "test folder" -Recurse -Filter START-WINDOWS.cmd | Select-Object -First 1
          $app = Start-Process -FilePath $start.FullName -ArgumentList "--no-open", "--port", "17640" -PassThru
          $url = "http://127.0.0.1:17640/"
          $health = $null
          for ($i = 0; $i -lt 40 -and -not $health; $i++) {
            Start-Sleep -Seconds 1
            try { $health = Invoke-RestMethod "$($url)_health" } catch {}
          }
          if (-not $health) { throw "The app did not start." }
          "Health: $($health | ConvertTo-Json -Compress)"
          $page = Invoke-WebRequest $url -UseBasicParsing
          if ($page.Content -notmatch "<title>Rain or Shine</title>") { throw "The page is not the app." }
          "Page: $($page.StatusCode)"
          $config = Invoke-RestMethod "$($url)config.public.json"
          "RPC: $($config.rpcOrigins -join ', ')"
          try {
            $hko = Invoke-WebRequest "$($url)hko-open-data/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en" -UseBasicParsing
            "HKO relay: $($hko.StatusCode)"
          } catch { "HKO relay: $($_.Exception.Message)" }
          Stop-Process -Id $app.Id -Force
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force

  macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop
          path: zips
      - name: Unzip and start the macOS package
        run: |
          zip=$(find zips -name 'Rain-or-Shine-macOS-arm64.zip' | head -1)
          mkdir -p "test folder"
          ditto -x -k "$zip" "test folder"
          start=$(find "test folder" -name START-MAC.command | head -1)
          "$start" --no-open --port 17641 > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:17641/_health && break; sleep 1; done
          echo
          curl -sf http://127.0.0.1:17641/ | grep -q '<title>Rain or Shine</title>'
          echo "Page: ok"
          curl -s -o /dev/null -w 'HKO relay: %{http_code}\n' 'http://127.0.0.1:17641/hko-open-data/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en' || true
          cat app.log

  publish:
    needs: [windows, macos]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop
          path: zips
      - name: Put the signed packages on the desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: find zips -name '*.zip' -print0 | xargs -0 gh release upload desktop --clobber --repo "$GITHUB_REPOSITORY"
